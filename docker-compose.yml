# One command to run the whole demo:  docker compose up --build
#
#   • API  →  http://localhost:8000  (FastAPI; /docs for the OpenAPI UI)
#   • UI   →  http://localhost:3000  (Next.js inspector)
#
# Live Claude answers: put ANTHROPIC_API_KEY in a .env file next to this file.
# Without a key the demo runs in deterministic OFFLINE mode (still fully traceable).
#
# Optional production swaps:
#   • True BGE-M3 multilingual embeddings:  build arg INSTALL_ML=true (see Dockerfile)
#   • Qdrant vector store:  `docker compose --profile qdrant up` + ABA_VECTOR_BACKEND=qdrant

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "false"
    ports:
      # Host port for direct API access/debugging only — the UI and tunnel reach the API
      # internally at api:8000 over the compose network, so this can be anything free.
      # Defaults to 8010 to avoid clashing with a local Apache/XAMPP on 8000.
      - "${ABA_API_HOST_PORT:-8010}:8000"
    environment:
      ABA_LLM_PROVIDER: ${ABA_LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ABA_OPENAI_BASE_URL: ${ABA_OPENAI_BASE_URL:-https://api.openai.com/v1}
      ABA_OFFLINE_MODE: ${ABA_OFFLINE_MODE:-auto}
      ABA_MODEL_GENERATION: ${ABA_MODEL_GENERATION:-claude-opus-4-8}
      ABA_MODEL_ROUTER: ${ABA_MODEL_ROUTER:-claude-sonnet-4-6}
      ABA_MODEL_SQL: ${ABA_MODEL_SQL:-claude-sonnet-4-6}
      ABA_VECTOR_BACKEND: ${ABA_VECTOR_BACKEND:-numpy}
      ABA_QDRANT_URL: http://qdrant:6333
      # Local-model (Ollama) target. The UI "Local model" toggle / runtime.set_model_mode
      # points the OpenAI-compatible client here. host.docker.internal reaches Ollama
      # running on the host (see extra_hosts below); override either via .env.
      ABA_LOCAL_BASE_URL: ${ABA_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      ABA_LOCAL_MODEL: ${ABA_LOCAL_MODEL:-qwen2.5:7b-instruct}
      # Auth & multi-tenancy. When enabled, every user-owned route requires a valid
      # identity JWT (minted by the UI's NextAuth layer, verified with the shared secret).
      ABA_AUTH_ENABLED: ${ABA_AUTH_ENABLED:-false}
      ABA_AUTH_SECRET: ${ABA_AUTH_SECRET:-}
      # Public origin (webhook target + deep links) and Telegram bot credentials.
      ABA_PUBLIC_BASE_URL: ${NEXTAUTH_URL:-https://assistant.lazysnail.xyz}
      ABA_TELEGRAM_BOT_TOKEN: ${ABA_TELEGRAM_BOT_TOKEN:-}
      ABA_TELEGRAM_BOT_USERNAME: ${ABA_TELEGRAM_BOT_USERNAME:-}
      ABA_TELEGRAM_WEBHOOK_SECRET: ${ABA_TELEGRAM_WEBHOOK_SECRET:-}
      ABA_WHATSAPP_PHONE_NUMBER_ID: ${ABA_WHATSAPP_PHONE_NUMBER_ID:-}
      ABA_WHATSAPP_ACCESS_TOKEN: ${ABA_WHATSAPP_ACCESS_TOKEN:-}
      ABA_WHATSAPP_VERIFY_TOKEN: ${ABA_WHATSAPP_VERIFY_TOKEN:-}
      ABA_WHATSAPP_BUSINESS_NUMBER: ${ABA_WHATSAPP_BUSINESS_NUMBER:-}
    extra_hosts:
      # Map host.docker.internal -> the host gateway so the container can reach
      # a locally-running Ollama (compose doesn't add this automatically).
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist the embedding + LLM-response cache across restarts so the engine
      # warms up instantly (no re-embedding the corpus on every (re)start).
      - aba_cache:/app/data/cache
      # Persist per-tenant state (sessions/workspaces/users DB) and customer uploads
      # across rebuilds/recreates. Without these, chat history & uploads are wiped on
      # every `docker compose up --build`. (Increment 3 moves the tenant store to Postgres.)
      - aba_state:/app/data/state
      - aba_uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # The Next server proxies /api/* to the API service (single public origin, no CORS).
        API_PROXY_TARGET: http://api:8000
        # Build-time (client-inlined): gate the app behind Google sign-in.
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-false}
    environment:
      API_PROXY_TARGET: http://api:8000
      # NextAuth (server-side, runtime). NEXTAUTH_URL must be the public origin so the
      # Google OAuth callback resolves; secrets are read from .env (never committed).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://assistant.lazysnail.xyz}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Shared with the API to sign the identity JWT the backend verifies.
      ABA_AUTH_SECRET: ${ABA_AUTH_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"

  # Public access for a live customer evaluation. Opt-in:
  #   docker compose --profile tunnel up -d
  # Then read the public URL from the tunnel's logs:
  #   docker compose logs tunnel | grep trycloudflare.com
  # The tunnel reaches the UI on the compose network (ui:3000); the UI proxies /api/*
  # to the API, so the whole app is served through one HTTPS origin (no CORS, no key
  # in the browser). This is a Cloudflare *quick tunnel* — the URL is random per start.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://ui:3000
    depends_on:
      - ui
    restart: unless-stopped

  # PERMANENT public URL — Cloudflare *Named Tunnel* (token-based).
  #   Brings the app up at a stable hostname (e.g. https://assistant.lazysnail.xyz)
  #   that is live whenever this stack is running. Unlike the quick `tunnel` above,
  #   the URL never changes. DNS is auto-managed by Cloudflare for that subdomain,
  #   so nothing at the zone apex (the existing quiz site) is touched.
  #
  # One-time setup (see scripts/tunnel.sh header for the click-by-click):
  #   1. Cloudflare Zero Trust → Networks → Tunnels → Create tunnel (Cloudflared) → copy the token.
  #   2. In that tunnel's Public Hostname tab: subdomain=assistant, domain=lazysnail.xyz,
  #      service = HTTP → ui:3000  (cloudflared reaches the UI over this compose network).
  #   3. Put the token in .env as CLOUDFLARE_TUNNEL_TOKEN=...
  # Run:  ./scripts/tunnel.sh   (or: docker compose --profile named-tunnel up -d named-tunnel)
  named-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["named-tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - ui
    restart: unless-stopped

volumes:
  aba_cache:
  aba_state:
  aba_uploads:
